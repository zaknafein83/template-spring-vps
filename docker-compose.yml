services:

  # ============================================================
  # Database: Postgres (default). Per Mongo, decommenta il blocco sotto.
  # ============================================================
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       myapp
      POSTGRES_USER:     myapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # db:
  #   image: mongo:7
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: myapp
  #     MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-myapp}
  #     MONGO_INITDB_DATABASE:      myapp
  #   volumes:
  #     - mongodata:/data/db
  #   ports:
  #     - "127.0.0.1:27017:27017"

  app:
    image: ghcr.io/zaknafein83/myapp:${TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/myapp
      SPRING_DATASOURCE_USERNAME: myapp
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-myapp}
      # MONGO_URI: mongodb://myapp:${DB_PASSWORD:-myapp}@db:27017/myapp?authSource=admin
      JWT_SECRET:    ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-chars}
      CORS_ORIGINS:  ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  # mongodata:

spring.application.name=myapp

# ============================================================
# DataSource (Postgres default)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:myapp}

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# MongoDB (commentato; per usarlo, decommenta e commenta le righe spring.datasource sopra)
# ============================================================
# spring.data.mongodb.uri=${MONGO_URI:mongodb://myapp:myapp@localhost:27017/myapp?authSource=admin}
# spring.data.mongodb.database=myapp

# ============================================================
# Actuator: espone /actuator/health, /actuator/health/readiness, /actuator/health/liveness
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ============================================================
# CORS (gestito a livello controller, lascio config base per riferimento)
# ============================================================
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long}

# ============================================================
# Server
# ============================================================
server.port=8080
